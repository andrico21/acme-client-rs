name: CI

on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev, master]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: Check advisories, licenses, bans & sources
        run: cargo deny check

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      # Accepted advisories are declared in .cargo/audit.toml, which mirrors the
      # ignore list in deny.toml. Keep both files in sync when revisiting.
      - name: Audit RustSec advisories
        run: cargo audit

      # RUST_GUIDELINES.md §10 lists `cargo vet` as a control, not an advisory:
      # it answers "has a human looked at this code?", which `cargo audit`
      # cannot. Blocking on purpose — after `cargo vet init` it passes by
      # construction, so the only way to fail is introducing an unvetted
      # dependency, and the fix (`cargo vet certify <crate>`) is self-documenting.
      - name: Install cargo-vet
        run: cargo install cargo-vet --locked

      - name: Check supply-chain audits
        run: cargo vet --locked

      # §12 classifies the two below as *Recommended* — "warnings are
      # informational, not blocking" — so they report without gating the merge.
      - name: Install cargo-machete
        run: cargo install cargo-machete --locked
        continue-on-error: true

      - name: Check for unused dependencies
        run: cargo machete
        continue-on-error: true

      - name: Install cargo-geiger
        run: cargo install cargo-geiger --locked
        continue-on-error: true

      - name: Census transitive `unsafe` usage
        run: cargo geiger --all-features
        continue-on-error: true

  lint:
    name: Lint (fmt + clippy)
    runs-on: ubuntu-latest
    # Promotes rustc warnings to errors for local packages only, without the
    # cache-busting of RUSTFLAGS="-D warnings" (RUST_GUIDELINES.md §7). The
    # clippy step still needs its own -D warnings: this covers rustc lints,
    # that covers clippy lints.
    env:
      CARGO_BUILD_WARNINGS: deny
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test-script output-safety lint
        run: bash tests/lint-output-safety.sh

  build-linux:
    name: Build & Test (Linux)
    runs-on: ubuntu-24.04
    container:
      image: rust:alpine
    env:
      CARGO_BUILD_WARNINGS: deny
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: apk add --no-cache build-base pkgconf openssl openssl-dev openssl-libs-static perl make tar zstd

      - name: Build
        run: cargo build --verbose

      - name: Run tests
        run: cargo test --verbose

      - name: Build release binary
        run: |
          cargo rustc --release -- -C relocation-model=pie -C link-args=-Wl,-z,relro,-z,now,-z,noexecstack
          strip target/release/acme-client-rs

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: acme-client-rs-linux
          path: target/release/acme-client-rs
          retention-days: 1

  # Native arm64 coverage for Raspberry Pi 3/4/5 (64-bit OS) and other
  # aarch64 hosts. Build+test only: the x86 build-linux job keeps the sole
  # acme-client-rs-linux artifact consumed by integration-test.
  build-linux-arm64:
    name: Build & Test (Linux arm64)
    runs-on: ubuntu-24.04-arm
    # JavaScript actions (checkout, ...) cannot run inside Alpine containers on
    # arm64 runners (the runner ships no alpine-arm64 node), so the job runs on
    # the host and only the build+test happens inside the Alpine image.
    steps:
      - uses: actions/checkout@v7

      - name: Build and test (native arm64, Alpine musl)
        run: |
          docker run --rm -v "$PWD:/work" -w /work rust:alpine sh -ec '
            apk add --no-cache build-base pkgconf openssl openssl-dev openssl-libs-static perl make tar zstd
            cargo build --verbose
            cargo test --verbose
          '

  # Compile coverage for Raspberry Pi 2/3/4 (32-bit OS). Cross-compiled natively
  # on amd64 via the messense musl toolchain (pinned by multi-arch INDEX digest);
  # build-only because test execution would need QEMU, which is flaky for this
  # workload — tests already run on the amd64 and arm64 legs.
  build-linux-armv7:
    name: Build (Linux armv7, cross)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Cross-build (armv7 musl)
        run: |
          # The image bakes in a docs-stripped toolchain that is itself named
          # "stable", so installing stable in place fails while rustup removes
          # the mismatched clippy component. Install into a private RUSTUP_HOME
          # instead: the image's rustc predates the crate's `rust-version`
          # floor, and the toolchain ships without the armv7 std.
          docker run --rm -v "$PWD:/work" -w /work \
            docker.io/messense/rust-musl-cross@sha256:965d005bc457b10afa22dc9211ee8c64beceab156d2d731a028f6d11d3b3e619 \
            sh -ec '
              export RUSTUP_HOME=/tmp/rustup
              rustup toolchain install stable --profile minimal
              rustup default stable
              rustup target add armv7-unknown-linux-musleabihf
              cargo build --verbose --target armv7-unknown-linux-musleabihf
            '

  build-windows:
    name: Build & Test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Build
        env:
          RUSTFLAGS: "-C control-flow-guard=yes -C link-args=/DYNAMICBASE -C link-args=/HIGHENTROPYVA -C link-args=/NXCOMPAT -C link-args=/CETCOMPAT"
        run: cargo build --verbose

      - name: Run tests
        env:
          RUSTFLAGS: "-C control-flow-guard=yes -C link-args=/DYNAMICBASE -C link-args=/HIGHENTROPYVA -C link-args=/NXCOMPAT -C link-args=/CETCOMPAT"
        run: cargo test --verbose

  integration-test:
    name: Integration Test (Pebble)
    runs-on: ubuntu-latest
    needs: build-linux
    steps:
      - uses: actions/checkout@v7

      - name: Download binary
        uses: actions/download-artifact@v8
        with:
          name: acme-client-rs-linux
          path: target/release

      - name: Install Podman
        run: sudo apt update && sudo apt install -y podman

      - name: Run test suite
        run: |
          chmod +x tests/test-podman.sh tests/test.sh target/release/acme-client-rs
          ./tests/test-podman.sh --no-build
