# cargo-audit configuration.
#
# Mirrors the `[advisories] ignore` list in deny.toml. The two files are read by
# different tools (cargo-deny and cargo-audit), so an advisory suppressed in one
# will still fail the other in CI — per RUST_GUIDELINES.md §10, keep them in sync.

[advisories]
ignore = [
    # RUSTSEC-2023-0071 (Marvin Attack): timing side-channel in the `rsa`
    # crate's PKCS#1 v1.5 *decryption*. We use `rsa` (a direct dependency) only
    # for PKCS#1 v1.5 *signing* of ACME JWS payloads (src/jws.rs), never for
    # decryption — so the advisory does not apply to our usage. No fixed version
    # of `rsa` exists yet (tracked upstream); revisit on every `rsa` upgrade and
    # remove this ignore from both files once a patched release ships.
    "RUSTSEC-2023-0071",
]
